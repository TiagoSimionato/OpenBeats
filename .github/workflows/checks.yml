name: Pull Requests Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: [lint, tsc]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout -b main origin/main
          git checkout -

      - name: Install dependenies
        run: yarn install --frozen-lockfile

      - name: Run Checks
        run: yarn ${{ matrix.command }}
